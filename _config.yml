# ===========================================
# Site Information Settings
# ===========================================

# Site creation time
since: 2026

# Custom your favicon.ico in `site/source`
favicon: /favicon.ico

# Set feed link (false | default | your feed link)
# false: disable
# default: use `atom.xml`, generator for `hexo-generator-feed`
rss: false

# ===========================================
# Menu Settings
# ===========================================
menu:
  Home: /
  Archives: /archives/
  Tags: /tags/
  Categories: /categories/
  About: /about/

# ===========================================
# Theme Settings
# ===========================================
# color: default | mint green | cobalt blue | hot pink | dark violet
color: hot pink

# default page mode: default | archives
mode: default

toc: true

# Excerpt (auto-truncate on homepage)
# Set to true to auto-generate excerpts when no <!-- more --> tag is used
# Use <!-- more --> in your post to manually set excerpt position
excerpt:
  enable: true
  # Max length of auto-generated excerpt (in characters)
  length: 300

# jQuery fancybox
fancybox: true

# LaTeX support
# Choose your renderer: 'mathjax' (default) | 'katex'
latex: true

# KaTeX options (used when latex is enabled and renderer is 'katex')
# Markdown Preview Enhanced uses KaTeX by default
katex:
  enable: true
  # Auto render options
  autoRender: true

# Reading time estimation
reading_time:
  enable: true
  # Words per minute (Chinese: ~300, English: ~200)
  words_per_minute: 300

# Mermaid diagram support
# Markdown Preview Enhanced uses Mermaid for flowchart, sequence diagram, etc.
mermaid:
  enable: true
  # Mermaid theme: default | dark | forest | neutral
  theme: default

copyright:
  enable: true
  # https://creativecommons.org/
  license: '<a rel="license" href="http://creativecommons.org/licenses/by-nc/4.0/" target="_blank">知识共享署名-非商业性使用 4.0 国际许可协议</a>'

reward:
  enable: false
  qrCode:
    wechat:
    alipay:

# ===========================================
# Social links Settings
# ===========================================
social:
  email:
  stack-overflow:
  twitter:
  facebook:
  linkedin:
  google:
  github:
  weibo:
  zhihu:
  douban:
  pocket:
  tumblr:
  instagram:

# ===========================================
# Third Party Services Settings
# ===========================================

# LeanCloud
leancloud:
  app_id:
  app_key:
  server_url:
  cdn:

# Baidu Analytics
baidu_analytics:
# Baidu Verification
baidu_verification:

# Baidu push
baidu_push:

# Google Analytics
google_analytics:
# Google Verification
google_verification:

# Disqus
disqus_shortname:

#Changyan
changyan:
  appid:
  appkey:

#LiveRe
livere_datauid:

# Gitalk
# Demo: https://gitalk.github.io
# https://github.com/gitalk/gitalk
gitalk:
  enable: false
  github_id: <your-github-id>
  repo: <your-repo>
  client_id: <your-client-id>
  client_secret: <your-client-secret>
  admin_user: <your-github-id>
  distraction_free_mode: true # Facebook-like distraction free mode
  # Gitalk's display language depends on user's browser or system environment
  # If you want everyone visiting your site to see a uniform language, you can set a force language value
  # Available values: en, es-ES, fr, ru, zh-CN, zh-TW
  language: en

# utterances
# Docs: https://utteranc.es/
# Tips: Make sure you have installed [utterances app](https://github.com/apps/utterances) in your repo
utterances:
  enable: false
  repo: owner/repo # Repository
  issueTerm: title  # Blog post ↔️ issue mapping: pathname | url | title | og:title
  theme: github-light # Theme: github-light | github-dark | github-dark-orange | icy-dark | dark-blue | photon-dark
  label: utterances # Issue label

# ===========================================
# Version
# ===========================================
version: 3.0.0